schema_version: 1
experiment:
  name: tfs_moe_fusion_full_training
  seed: 3407
  deterministic: true
  output_dir: runs
model:
  name: tfs_moe_fusion
  output_channels: 3
  pad_multiple: 8
  backbone:
    name: custom_multiscale
    channels:
    - 48
    - 96
    - 192
    - 384
    depths:
    - 2
    - 2
    - 4
    - 4
    max_downsample: 8
    normalization: group_norm
    shared_source_encoder: true
    separate_modality_stems: true
    preserve_source_pyramids: true
    preserve_fused_pyramid: true
    dw_kernel_size: 3
    mlp_ratio: 2.0
    layer_scale_init: 1.0e-06
    drop_path: 0.0
  frequency:
    enabled: true
    dwt: true
    afno: true
    fdconv: true
    cross_frequency: true
    placements:
    - s2
    - s3
    - s4
    afno_num_blocks: 8
    afno_sparsity_threshold: 0.01
    afno_hard_thresholding_fraction: 1.0
    fdconv_kernel_size: 3
    fdconv_kernel_num: 8
    residual_scale: 0.1
    statistics_detach: false
    force_fp32_fft: true
    frequency_bands:
    - 0.0
    - 0.0625
    - 0.125
    - 0.25
    - 0.5
  moe:
    enabled: true
    experts:
    - common
    - low_frequency
    - detail
    - semantic
    - infrared_saliency
    top_k: 2
    sparse_execution: true
    train_execution: dense_masked
    inference_execution: sparse_batch
    spatial_gating: true
    router_branches:
    - feature
    - task
    - spectrum
    - modality
    - auxiliary
    infrared_requires_ir_modality: true
    placements:
    - s2
    - s3
    - s4
    block_counts:
      s1: 0
      s2: 1
      s3: 2
      s4: 2
    router_hidden_channels: 64
    expert_expansion: 2
    residual_scale: 0.001
    router_temperature: 1.0
    task_embedding_dim: 64
    modality_embedding_dim: 32
    force_fp32_routing: true
    spatial_identity_init: true
    branch_dropout: 0.0
    noisy_topk: false
    noisy_topk_std: 0.1
  guidance:
    focus:
      enabled: true
      backend: lightweight_focus
      predicted_guidance_only: true
      hidden_channels: 32
      run_policy: all
      source_stages:
      - s1
      - s2
      use_sobel: true
      use_laplacian: true
      use_fdconv: true
      detach_backbone_features: false
      gradient_normalization: per_sample
    semantic:
      enabled: true
      backend: segformer_b0_local
      frozen: true
      predicted_guidance_only: true
      model_dir: weights/segformer_b0_citycapes
      input_size: 256
      num_classes: 19
      strict_loading: true
      detach_guidance_input: false
      guidance_policy: all
      guidance_tasks:
      - vif
      - mfif
      - seg
      final_pass_policy: seg_only
  feedback:
    enabled: true
    independent_moe_parameters: true
    task_film: true
    placements:
    - s3
    - s2
    guide_channels: 32
    transformer_heads: 4
    transformer_window_size: 4
    mfif_interaction: true
    residual_scale: 0.001
    max_residual: 0.25
    num_iterations: 1
    share_with_encoder_moe: false
  ablation:
    disable_focus_head: false
    disable_focus_feedback: false
    disable_semantic_feedback: false
    detach_focus_from_backbone: false
    detach_semantic_input: false
    disable_guidance_pyramid: false
    disable_feedback_moe: false
    disable_task_film: false
    disable_refinement_decoder: false
    disable_final_residual: false
    share_feedback_encoder_moe: false
data:
  dataset: deterministic_dummy
  height: 128
  width: 128
  dummy_length: 48
  num_workers: 0
  pin_memory: false
training:
  epochs: 100
  steps_per_epoch: 1000
  max_steps: null
  batch_size: 4
  precision: bf16
  optimizer:
    name: adamw
    learning_rate: 0.0002
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
    epsilon: 1.0e-08
    lr_multipliers:
      semantic_experts: 0.5
      feedback_experts: 0.5
      feedback_routers: 0.5
  scheduler:
    name: cosine_with_warmup
    warmup_steps: 5000
    minimum_learning_rate: 1.0e-06
    step_size: 10000
    gamma: 0.5
  task_sampling:
    strategy: weighted_random
    weights:
      vif: 1.0
      mfif: 1.0
      seg: 1.0
  gradient_strategy: alternating
  gradient_accumulation_steps: 1
  gradient_clip:
    enabled: true
    max_norm: 1.0
  task_update_policy:
    freeze:
      vif: []
      mfif:
      - ir_experts
      - semantic_experts
      seg:
      - focus_head
  phases:
    phases:
    - name: stabilization
      start: 0
      end: 5
      loss_multipliers:
        frequency: 0.0
        consistency: 0.0
    - name: auxiliary_alignment
      start: 5
      end: 15
      loss_multipliers:
        frequency: 0.5
    - name: joint
      start: 15
      end: 90
      loss_multipliers: {}
    - name: routing_finetune
      start: 90
      end: 100
      loss_multipliers:
        moe: 1.5
  router_temperature:
    start: 1.5
    end: 0.7
    schedule: cosine
    minimum: 0.5
  diagnostics:
    interval: 100
    gradient_conflict_enabled: false
    gradient_conflict_interval: 1000
    router_collapse_threshold: 0.95
    collapse_patience: 10
  log_every_steps: 10
  ema:
    enabled: false
    decay: 0.999
  ewc:
    enabled: false
    weight: 0.0
    groups:
    - shared_backbone
    - common_experts
    fisher_batches: 100
  losses:
    strict_targets: true
    vif:
      intensity: 1.0
      gradient: 1.0
      ssim: 0.5
      color: 0.2
      coarse_supervision: 0.25
      ssim_mode: source_max
    mfif:
      reconstruction: 1.0
      gradient: 1.0
      ssim: 0.5
      coarse_supervision: 0.25
      use_charbonnier: false
    focus:
      selection: 1.0
      boundary: 0.5
      confidence: 0.1
    semantic:
      cross_entropy: 1.0
      dice: 1.0
      coarse_supervision: 0.25
      ignore_index: 255
      class_weights: null
      improvement_enabled: false
      improvement_weight: 0.0
      improvement_margin: 0.0
      boundary_alignment: 0.05
    frequency:
      enabled: true
      weight: 0.01
      low_leakage: 1.0
      detail_leakage: 1.0
      semantic_boundary: 0.1
    moe:
      enabled: true
      weight: 0.01
      hard_load_weight: 1.0
      entropy_enabled: false
      entropy_weight: 0.0
      entropy_target: 1.0
    consistency:
      enabled: true
      weight: 0.01
      probability: 0.25
      gaussian_kernel_size: 9
      gaussian_sigma: 2.0
    infrared:
      enabled: true
      weight: 0.1
      detach_saliency: true
    regularization:
      residual_magnitude: 0.001
      range_penalty: 0.001
  checkpoint:
    every_epochs: 1
    every_steps: 1000
    keep_last: 3
    resume: null
  distributed:
    enabled: false
    find_unused_parameters: true

